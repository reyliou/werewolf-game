<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>幽影微語 (Whisper of Shadows) - 6人微創新類狼人殺</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas#game-canvas {
      display: block;
      background-color: #0f111a;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      cursor: crosshair;
    }
    /* 頂部 HUD 狀態列 */
    #hud-overlay {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(15, 17, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      pointer-events: auto;
    }
    .hud-title {
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .hud-value {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }
    /* 底部操作面板 */
    #bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .game-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .game-btn:active {
      transform: translateY(0);
    }
    .btn-emergency {
      background: #dc2626;
      border-color: #ef4444;
    }
    .btn-emergency:hover {
      background: #b91c1c;
      border-color: #f87171;
    }
    /* 會議與投票遮罩 */
    #meeting-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 12, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .meeting-card {
      width: 90%;
      max-width: 720px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .meeting-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vote-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .vote-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px;
      border-radius: 8px;
      color: #e2e8f0;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .vote-btn:hover {
      background: #2563eb;
      border-color: #60a5fa;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud-overlay">
      <div class="hud-panel">
        <div class="hud-title">目前身分</div>
        <div class="hud-value" id="hud-role">偵探 (Detective)</div>
      </div>
      <div class="hud-panel">
        <div class="hud-title">儀式進度</div>
        <div class="hud-value" id="hud-ritual">0.0%</div>
      </div>
      <div class="hud-panel">
        <div class="hud-title">剩餘時間</div>
        <div class="hud-value" id="hud-timer">90s</div>
      </div>
    </div>

    <canvas id="game-canvas" width="1200" height="900"></canvas>

    <div id="bottom-controls">
      <button class="game-btn" id="btn-skill">⚡ 發動主動技能 [Space]</button>
      <button class="game-btn btn-emergency" id="btn-emergency">🔔 敲響警鐘 [E]</button>
    </div>

    <!-- 會議與投票面板 -->
    <div id="meeting-modal">
      <div class="meeting-card">
        <div class="meeting-header">
          <h2 id="meeting-title" style="color: #f43f5e;">⚠️ 緊急圓桌會議已召開</h2>
          <span id="voting-timer" style="font-weight: 700; color: #38bdf8;">倒數 25s</span>
        </div>
        <p id="meeting-desc" style="color: #94a3b8; margin-bottom: 20px;">
          全員在此發表陳述並指認可疑幽影，得票最高者將被流放！
        </p>
        <div class="vote-grid" id="vote-options">
          <!-- 投票選項動態插入 -->
        </div>
        <div style="text-align: right;">
          <button class="game-btn" id="btn-skip-vote">棄票 (Skip Vote)</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
