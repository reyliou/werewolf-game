<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>幽影微語 (Whisper of Shadows) - 6人微創新類狼人殺</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas#game-canvas {
      display: block;
      background-color: #0f111a;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      cursor: crosshair;
    }
    /* 頂部 HUD 狀態列 */
    #hud-overlay {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(15, 17, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      pointer-events: auto;
    }
    .hud-title {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .hud-value {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    /* 底部操作面板 */
    #bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .game-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .game-btn:active {
      transform: translateY(0);
    }
    .btn-emergency {
      background: #dc2626;
      border-color: #ef4444;
    }
    .btn-emergency:hover {
      background: #b91c1c;
      border-color: #f87171;
    }

    /* 大廳與連線設定面板 (Lobby Modal) */
    #lobby-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 13, 0.94);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .lobby-card {
      width: 90%;
      max-width: 520px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }
    .lobby-title {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lobby-badge {
      font-size: 11px;
      background: #0369a1;
      color: #e0f2fe;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .lobby-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      border-color: #38bdf8;
    }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .room-display {
      background: #020617;
      border: 1px dashed #38bdf8;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin: 16px 0;
      display: none;
    }
    .room-code-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #38bdf8;
      margin-bottom: 8px;
      font-family: monospace;
    }
    .player-list-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 12px;
      margin: 14px 0;
      font-size: 13px;
      color: #cbd5e1;
      max-height: 140px;
      overflow-y: auto;
    }

    /* 會議與投票遮罩 */
    #meeting-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 12, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .meeting-card {
      width: 90%;
      max-width: 720px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .meeting-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vote-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .vote-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px;
      border-radius: 8px;
      color: #e2e8f0;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .vote-btn:hover {
      background: #2563eb;
      border-color: #60a5fa;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- 大廳連線彈窗 -->
    <div id="lobby-modal">
      <div class="lobby-card">
        <div class="lobby-title">
          <span>幽影微語 (Whisper of Shadows)</span>
          <span class="lobby-badge">WebRTC P2P 6人局</span>
        </div>
        <p class="lobby-subtitle">
          微創新非對稱機制：守密同盟、幽影一族與中立狂徒。無須伺服器，一人開房即可 6 人連線！
        </p>

        <div class="form-group">
          <label class="form-label" for="input-nickname">玩家暱稱 (Your Nickname)</label>
          <input type="text" id="input-nickname" class="form-input" placeholder="例如: 福爾摩斯" value="調查員" />
        </div>

        <div id="join-section" class="form-group">
          <label class="form-label" for="input-roomcode">房間代碼 (Room Code)</label>
          <input type="text" id="input-roomcode" class="form-input" placeholder="例如: WW-A4F2" />
        </div>

        <div class="action-grid" id="main-actions">
          <button class="game-btn" id="btn-create-room" style="background: #2563eb; border-color: #3b82f6;">
            🏠 建立房間 (Host)
          </button>
          <button class="game-btn" id="btn-join-room">
            🔗 連線加入 (Join)
          </button>
        </div>

        <!-- 房主房間狀態面板 -->
        <div class="room-display" id="host-room-panel">
          <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">房間代碼 (請分享給好友)</div>
          <div class="room-code-text" id="display-room-code">WW-XXXX</div>
          <button class="game-btn" id="btn-copy-code" style="margin: 0 auto 10px auto; font-size: 12px; padding: 6px 14px;">
            📋 複製房間代碼
          </button>
          <div class="player-list-box" id="player-status-list">
            等待玩家連入... (1/6)
          </div>
          <button class="game-btn" id="btn-start-game" style="width: 100%; background: #16a34a; border-color: #22c55e; justify-content: center;">
            🚀 全員就緒，開始遊戲
          </button>
        </div>

        <!-- 客戶端等待面板 -->
        <div class="room-display" id="client-waiting-panel">
          <div style="font-size: 14px; color: #38bdf8; margin-bottom: 8px;">已成功連線至房主！</div>
          <p style="font-size: 13px; color: #94a3b8;">請等待房主分派身分並正式開啟對局...</p>
        </div>

        <div style="margin-top: 18px; text-align: center;">
          <button id="btn-solo-sandbox" style="background: transparent; border: none; color: #64748b; font-size: 13px; cursor: pointer; text-decoration: underline;">
            進入單機模擬沙盒 (含5個機器人測試)
          </button>
        </div>
      </div>
    </div>

    <!-- HUD 狀態列 -->
    <div id="hud-overlay">
      <div class="hud-panel">
        <div class="hud-title">目前身分 / 房間</div>
        <div class="hud-value" id="hud-role">未就緒</div>
      </div>
      <div class="hud-panel">
        <div class="hud-title">儀式進度</div>
        <div class="hud-value" id="hud-ritual">0.0%</div>
      </div>
      <div class="hud-panel">
        <div class="hud-title">剩餘時間</div>
        <div class="hud-value" id="hud-timer">90s</div>
      </div>
    </div>

    <canvas id="game-canvas" width="1200" height="900"></canvas>

    <div id="bottom-controls">
      <button class="game-btn" id="btn-skill">⚡ 發動主動技能 [Space]</button>
      <button class="game-btn btn-emergency" id="btn-emergency">🔔 敲響警鐘 [E]</button>
    </div>

    <!-- 會議與投票面板 -->
    <div id="meeting-modal">
      <div class="meeting-card">
        <div class="meeting-header">
          <h2 id="meeting-title" style="color: #f43f5e;">⚠️ 緊急圓桌會議已召開</h2>
          <span id="voting-timer" style="font-weight: 700; color: #38bdf8;">倒數 25s</span>
        </div>
        <p id="meeting-desc" style="color: #94a3b8; margin-bottom: 20px;">
          全員在此發表陳述並指認可疑幽影，得票最高者將被流放！
        </p>
        <div class="vote-grid" id="vote-options">
          <!-- 投票選項動態插入 -->
        </div>
        <div style="text-align: right;">
          <button class="game-btn" id="btn-skip-vote">棄票 (Skip Vote)</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
